{% extends 'base.html' %}
{% block title %}Login - Library Management System{% endblock %}

{% block guest_content %}
<div class="login-page">
    <div class="login-card">
        <div class="login-header">
            <span class="login-logo">&#128218;</span>
            <h2>College Library</h2>
            <p>Book Management System</p>
        </div>
        <form method="post" novalidate>
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label" for="{{ form.username.id_for_label }}">Username</label>
                {{ form.username }}
            </div>
            <div class="form-group">
                <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
                {{ form.password }}
            </div>
            <button type="submit" class="btn btn-primary btn-full">Login</button>
        </form>
    </div>
</div>
{% endblock %}
